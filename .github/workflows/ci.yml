name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer test
      - run: composer linter:check

  # The vendored conformance fixtures must be byte-identical to grafida/shell's at the commit
  # protocol/FIXTURES_REF names (refresh them with scripts/sync-fixtures.sh, never by hand).
  fixtures:
    name: Fixtures match grafida/shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: echo "sha=$(cat protocol/FIXTURES_REF)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: grafida/shell
          ref: ${{ steps.ref.outputs.sha }}
          path: upstream-shell
      - run: diff -r upstream-shell/protocol/fixtures protocol/fixtures
